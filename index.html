<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מבצעית 931</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body { 
      background-color: #0b132b; 
      color: #ffffff; 
      font-family: system-ui, -apple-system, sans-serif;
      background-attachment: fixed;
    }
    .card { background-color: rgba(28, 37, 65, 0.9); border: 1px solid #2a385b; backdrop-filter: blur(8px); }
  </style>
</head>
<body class="p-4 max-w-4xl mx-auto pb-12">

  <!-- כותרת ראשית -->
  <header class="text-center mb-6 border-b border-gray-700 pb-4">
    <h1 class="text-2xl font-bold text-blue-400">ניהול מלאי רימונים בבונקר</h1>
    <p class="text-xs text-green-400 mt-1">● מחובר לענן (Firebase) - סנכרון בזמן אמת</p>
    
    <div class="flex justify-center gap-4 mt-4">
      <button id="btn-dashboard" onclick="switchTab('dashboard')" class="bg-blue-600 px-5 py-2 rounded-lg font-bold text-sm">דו"ח מרוכז</button>
      <button id="btn-teams" onclick="switchTab('teams')" class="bg-gray-700 px-5 py-2 rounded-lg font-bold text-sm">צוותים</button>
    </div>
  </header>

  <!-- מסך 1: דו"ח מרוכז -->
  <div id="tab-dashboard">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      <div class="card p-3 rounded-xl text-center">
        <span class="text-gray-400 text-xs block mb-1">מספרי סדרה</span>
        <span id="stat-series-count" class="text-2xl font-extrabold text-blue-300">0</span>
      </div>
      <div class="card p-3 rounded-xl text-center">
        <span class="text-gray-400 text-xs block mb-1">סך רימונים מאופסנים</span>
        <span id="stat-zeroed" class="text-2xl font-extrabold text-green-400">0</span>
      </div>
      <div class="card p-3 rounded-xl text-center">
        <span class="text-gray-400 text-xs block mb-1">סך רימונים בחוץ</span>
        <span id="stat-outside" class="text-2xl font-extrabold text-amber-400">0</span>
      </div>
      <div class="card p-3 rounded-xl text-center">
        <span class="text-gray-400 text-xs block mb-1">סך רימונים רשומים</span>
        <span id="stat-total" class="text-2xl font-extrabold text-white">0</span>
      </div>
    </div>

    <div class="card p-4 rounded-xl">
      <h2 class="text-sm font-bold mb-3 text-center border-b border-gray-700 pb-2">כמות מאופסנת לכל מספר סדרה - סה"כ ולפי צוותים</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-center text-xs">
          <thead>
            <tr id="matrix-header" class="border-b border-gray-600 text-gray-400">
              <th class="p-2 text-right">מספר סדרה</th>
            </tr>
          </thead>
          <tbody id="matrix-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- מסך 2: רשימת צוותים -->
  <div id="tab-teams" class="hidden">
    <div class="card p-3 rounded-xl mb-4 flex gap-2">
      <input type="text" id="new-team-name" placeholder="שם צוות נוסף (למשל: רתק, חוד)..." class="bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm flex-1 text-white">
      <button onclick="addTeam()" class="bg-blue-600 px-4 py-2 rounded-lg text-sm font-bold">הוסף צוות</button>
    </div>

    <div id="teams-list" class="space-y-3"></div>
  </div>

  <!-- מסך 3: ניהול צוות ספציפי -->
  <div id="tab-single-team" class="hidden">
    <button onclick="switchTab('teams')" class="text-xs text-blue-400 mb-3 block">← חזרה לכל הצוותים</button>
    <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
      <h2 id="current-team-title" class="text-xl font-bold"></h2>
    </div>

    <div class="card p-3 rounded-xl mb-4 flex gap-2">
      <input type="text" id="new-soldier-name" placeholder="שם חייל חדש..." class="bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm flex-1 text-white">
      <button onclick="addSoldier()" class="bg-green-600 px-4 py-2 rounded-lg text-sm font-bold">הוסף חייל</button>
    </div>

    <div id="soldiers-list" class="space-y-4"></div>
  </div>

  <script>
    // הַחְלֵף אֶת הַקֶּטַע הַבָּא בַּמַּפְתְּחוֹת שֶׁלְּךָ מִ-FIREBASE:
    const firebaseConfig = {
  apiKey: "AIzaSyA2Fa08VxXozP-fAYOBJhkzWA-qOL6VYBU",
  authDomain: "grande-815a1.firebaseapp.com",
  databaseURL: "https://grande-815a1-default-rtdb.firebaseio.com",
  projectId: "grande-815a1",
  storageBucket: "grande-815a1.firebasestorage.app",
  messagingSenderId: "921189338159",
  appId: "1:921189338159:web:1fa991d9e776bc7d228ada",
  measurementId: "G-NSMKKY2EER"
};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentTeamId = null;

    function switchTab(tabName) {
      document.getElementById('tab-dashboard').classList.add('hidden');
      document.getElementById('tab-teams').classList.add('hidden');
      document.getElementById('tab-single-team').classList.add('hidden');
      
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');

      document.getElementById('btn-dashboard').className = tabName === 'dashboard' ? 'bg-blue-600 px-5 py-2 rounded-lg font-bold text-sm' : 'bg-gray-700 px-5 py-2 rounded-lg font-bold text-sm';
      document.getElementById('btn-teams').className = tabName !== 'dashboard' ? 'bg-blue-600 px-5 py-2 rounded-lg font-bold text-sm' : 'bg-gray-700 px-5 py-2 rounded-lg font-bold text-sm';
    }

    db.ref('inventory').on('value', (snapshot) => {
      const data = snapshot.val() || {};
      renderDashboard(data);
      renderTeams(data);
      if (currentTeamId) renderSingleTeam(data, currentTeamId);
    });

    function addTeam() {
      const nameInput = document.getElementById('new-team-name');
      const name = nameInput.value.trim();
      if (!name) return;
      const teamId = db.ref('inventory').push().key;
      db.ref(`inventory/${teamId}`).set({ name: name, soldiers: {} });
      nameInput.value = '';
    }

    function deleteTeam(teamId, teamName) {
      if (confirm(`האם אתה בטוח שברצונך למחוק את צוות "${teamName}" וכל הנתונים שלו?`)) {
        db.ref(`inventory/${teamId}`).remove();
      }
    }

    function addSoldier() {
      const nameInput = document.getElementById('new-soldier-name');
      const name = nameInput.value.trim();
      if (!name || !currentTeamId) return;
      const soldierId = db.ref(`inventory/${currentTeamId}/soldiers`).push().key;
      db.ref(`inventory/${currentTeamId}/soldiers/${soldierId}`).set({ name: name, grenades: {} });
      nameInput.value = '';
    }

    function deleteSoldier(soldierId, soldierName) {
      if (confirm(`האם למחוק את החייל "${soldierName}"?`)) {
        db.ref(`inventory/${currentTeamId}/soldiers/${soldierId}`).remove();
      }
    }

    function addGrenade(soldierId) {
      db.ref(`inventory/${currentTeamId}/soldiers/${soldierId}/grenades`).push({
        serial: '',
        number: '',
        isZeroed: false
      });
    }

    function updateGrenade(soldierId, grenadeId, field, value) {
      db.ref(`inventory/${currentTeamId}/soldiers/${soldierId}/grenades/${grenadeId}/${field}`).set(value);
    }

    function deleteGrenade(soldierId, grenadeId) {
      db.ref(`inventory/${currentTeamId}/soldiers/${soldierId}/grenades/${grenadeId}`).remove();
    }

    function renderTeams(data) {
      const list = document.getElementById('teams-list');
      list.innerHTML = '';
      Object.keys(data).forEach(teamId => {
        const team = data[teamId];
        const soldiers = team.soldiers ? Object.values(team.soldiers) : [];
        let totalZeroed = 0;
        
        soldiers.forEach(s => {
          if (s.grenades) {
            Object.values(s.grenades).forEach(g => { if (g.isZeroed) totalZeroed++; });
          }
        });

        list.innerHTML += `
          <div class="card p-4 rounded-xl flex justify-between items-center">
            <div>
              <h3 class="font-bold text-lg">${team.name}</h3>
              <p class="text-xs text-gray-400">${soldiers.length} חיילים · ${totalZeroed} רימונים מאופסנים</p>
            </div>
            <div class="flex gap-2">
              <button onclick="openTeam('${teamId}')" class="bg-blue-600 px-3 py-2 rounded-lg text-xs font-bold">כניסה לצוות</button>
              <button onclick="deleteTeam('${teamId}', '${team.name}')" class="bg-red-900/60 hover:bg-red-800 text-red-300 border border-red-700 px-3 py-2 rounded-lg text-xs font-bold">מחק צוות</button>
            </div>
          </div>
        `;
      });
    }

    function openTeam(teamId) {
      currentTeamId = teamId;
      switchTab('single-team');
      db.ref('inventory').once('value', snapshot => renderSingleTeam(snapshot.val() || {}, teamId));
    }

    function renderSingleTeam(data, teamId) {
      const team = data[teamId];
      if (!team) return;
      document.getElementById('current-team-title').innerText = `צוות ${team.name}`;

      const list = document.getElementById('soldiers-list');
      list.innerHTML = '';

      const soldiers = team.soldiers || {};
      Object.keys(soldiers).forEach(sId => {
        const soldier = soldiers[sId];
        const grenades = soldier.grenades || {};

        let grenadesHTML = '';
        let count = 1;
        Object.keys(grenades).forEach(gId => {
          const g = grenades[gId];
          grenadesHTML += `
            <div class="bg-gray-800 p-2.5 rounded-lg border border-gray-700 text-xs space-y-2 mt-2">
              <div class="flex items-center justify-between">
                <span class="text-gray-400 font-bold">רימון ${count++}</span>
                <button onclick="deleteGrenade('${sId}', '${gId}')" class="text-red-400 text-xs">מחק רימון</button>
              </div>
              <div class="flex gap-2">
                <input type="text" placeholder="סדרה (למשל 4-21)" value="${g.serial || ''}" 
                  onchange="updateGrenade('${sId}', '${gId}', 'serial', this.value)" class="bg-gray-900 p-2 rounded border border-gray-700 w-1/2 text-center text-white">
                <input type="text" placeholder="מס' רימון" value="${g.number || ''}" 
                  onchange="updateGrenade('${sId}', '${gId}', 'number', this.value)" class="bg-gray-900 p-2 rounded border border-gray-700 w-1/2 text-center text-white">
              </div>
              <label class="flex items-center gap-2 cursor-pointer pt-1">
                <input type="checkbox" ${g.isZeroed ? 'checked' : ''} 
                  onchange="updateGrenade('${sId}', '${gId}', 'isZeroed', this.checked)" class="w-4 h-4 text-blue-600 rounded">
                <span class="${g.isZeroed ? 'text-green-400 font-bold' : 'text-gray-300'}">מאופסן</span>
              </label>
            </div>
          `;
        });

        list.innerHTML += `
          <div class="card p-3 rounded-xl">
            <div class="flex justify-between items-center border-b border-gray-700 pb-2 mb-2">
              <h4 class="font-bold text-sm text-white">${soldier.name}</h4>
              <button onclick="deleteSoldier('${sId}', '${soldier.name}')" class="text-red-400 hover:text-red-300 text-xs">מחק חייל</button>
            </div>
            ${grenadesHTML}
            <button onclick="addGrenade('${sId}')" class="w-full mt-3 bg-gray-700 hover:bg-gray-600 text-xs py-2 rounded-lg font-bold">+ הוסף רימון</button>
          </div>
        `;
      });
    }

    function renderDashboard(data) {
      let totalRegistered = 0;
      let totalZeroed = 0;
      let seriesMap = {}; 
      let teamNames = [];

      Object.values(data).forEach(team => {
        if (!teamNames.includes(team.name)) teamNames.push(team.name);
        if (!team.soldiers) return;

        Object.values(team.soldiers).forEach(s => {
          if (!s.grenades) return;
          Object.values(s.grenades).forEach(g => {
            if (g.serial || g.number) {
              totalRegistered++;
              if (g.isZeroed) {
                totalZeroed++;
                if (g.serial) {
                  if (!seriesMap[g.serial]) seriesMap[g.serial] = {};
                  seriesMap[g.serial][team.name] = (seriesMap[g.serial][team.name] || 0) + 1;
                }
              }
            }
          });
        });
      });

      const totalOutside = totalRegistered - totalZeroed;

      document.getElementById('stat-total').innerText = totalRegistered;
      document.getElementById('stat-zeroed').innerText = totalZeroed;
      document.getElementById('stat-outside').innerText = totalOutside;
      document.getElementById('stat-series-count').innerText = Object.keys(seriesMap).length;

      const header = document.getElementById('matrix-header');
      header.innerHTML = '<th class="p-2 text-right">מספר סדרה</th>';
      teamNames.forEach(name => {
        header.innerHTML += `<th class="p-2">${name}</th>`;
      });

      const tbody = document.getElementById('matrix-body');
      tbody.innerHTML = '';
      Object.keys(seriesMap).forEach(serial => {
        let rowHTML = `<tr class="border-b border-gray-700"><td class="p-2 font-bold text-right">${serial}</td>`;
        teamNames.forEach(name => {
          const count = seriesMap[serial][name] || '-';
          rowHTML += `<td class="p-2 ${count !== '-' ? 'text-green-400 font-bold' : 'text-gray-500'}">${count}</td>`;
        });
        rowHTML += '</tr>';
        tbody.innerHTML += rowHTML;
      });
    }
  </script>
</body>
</html>
